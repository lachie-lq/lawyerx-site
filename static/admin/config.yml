backend:
  name: github
  repo: lachie-lq/lawyerx-site
  branch: main
  base_url: https://lawyerx-site.pages.dev
  auth_endpoint: api/auth

site_url: https://lawyerx.com
display_url: https://lawyerx.com
logo_url: https://lawyerx.com/assets/favicon.svg

media_folder: "static/uploads"
public_folder: "/uploads"

slug:
  encoding: "unicode"
  clean_accents: true
  sanitize_replacement: "-"

collections:
  - name: "articles"
    label: "专业文章"
    label_singular: "文章"
    folder: "content/articles"
    create: true
    delete: true
    extension: "md"
    format: "frontmatter"
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{title}} · {{category}} · {{date}}"
    sortable_fields: ["date", "title", "category"]
    view_filters:
      - label: "已发布"
        field: "draft"
        pattern: "false"
      - label: "草稿"
        field: "draft"
        pattern: "true"
      - label: "首页推荐"
        field: "featured"
        pattern: "true"
    fields:
      - { label: "文章标题", name: "title", widget: "string" }
      - { label: "搜索摘要", name: "description", widget: "text", hint: "建议80至150字，用于搜索结果和AI理解。" }
      - { label: "列表摘要", name: "summary", widget: "text", hint: "用于首页和文章列表，建议60至120字。" }
      - label: "文章分类"
        name: "category"
        widget: "select"
        options: ["知识产权", "商事争议", "企业合规", "刑事法律", "婚姻家事", "劳动用工", "法律观察", "其他"]
      - { label: "发布日期", name: "date", widget: "datetime", format: "YYYY-MM-DDTHH:mm:ssZ", date_format: "YYYY-MM-DD", time_format: "HH:mm" }
      - { label: "最后修改时间", name: "modified", widget: "datetime", required: false, format: "YYYY-MM-DDTHH:mm:ssZ", date_format: "YYYY-MM-DD", time_format: "HH:mm" }
      - { label: "首页推荐", name: "featured", widget: "boolean", default: false, required: false }
      - { label: "保存为草稿", name: "draft", widget: "boolean", default: false, required: false, hint: "开启后不会出现在公开网站。" }
      - { label: "封面图片", name: "cover", widget: "image", required: false, hint: "建议横图，宽度至少1200像素。" }
      - { label: "封面图片说明", name: "cover_alt", widget: "string", required: false, hint: "描述图片内容，便于搜索引擎和无障碍访问。" }
      - { label: "关键词", name: "keywords", widget: "list", required: false, field: { label: "关键词", name: "keyword", widget: "string" } }
      - { label: "正文", name: "body", widget: "markdown", modes: ["rich_text", "raw"], buttons: ["bold", "italic", "code", "link", "heading-one", "heading-two", "heading-three", "quote", "bulleted-list", "numbered-list"], editor_components: ["image", "code-block"] }
